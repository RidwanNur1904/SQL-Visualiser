<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Universal MySQL Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/alasql@1.7.3/dist/alasql.min.js"></script>
  <style>
    :root {
      --bg-dark: #282c34;
      --bg-card: #21252b;
      --bg-input: #1e2227;
      --border-light: #3e4451;
      --text-main: #abb2bf;
      --text-muted: #5c6370;
      --accent-blue: #61afef;
      --accent-cyan: #56b6c2;
      --accent-green: #98c379;
      --accent-purple: #c678dd;
      --accent-red: #e06c75;
      --accent-yellow: #e5c07b;
    }

    body {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      padding: 24px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
    }

    h2 { color: var(--accent-blue); font-size: 1.25rem; margin-top: 0; }
    h3 { color: var(--accent-purple); font-size: 1.1rem; margin-top: 20px; }

    textarea {
      width: 100%;
      height: 120px;
      font-family: inherit;
      background-color: var(--bg-input);
      color: var(--accent-yellow);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 12px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }

    textarea:focus { border-color: var(--accent-blue); }

    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-family: inherit;
    }

    .tables-container { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }

    table {
      border-collapse: collapse;
      background-color: var(--bg-card);
      width: 100%;
      margin-top: 8px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-light);
    }

    th, td {
      border: 1px solid var(--border-light);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    th { background-color: #2c313a; color: var(--accent-cyan); }
    .step-box { background-color: var(--bg-card); border: 1px solid var(--border-light); padding: 18px; margin-bottom: 20px; border-radius: 6px; }
    .step-header { font-weight: bold; color: var(--accent-green); margin-bottom: 10px; }
    .code-snippet { background-color: var(--bg-input); color: var(--accent-red); padding: 2px 8px; border-radius: 4px; }
    .null-val { color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

  <h2><span>⚡</span> 1. Import MySQL Schema & Data</h2>
  <textarea id="schemaInput" placeholder="Paste CREATE TABLE and INSERT statements here..."></textarea>
  <button onclick="loadSchema()">Load Schema & Render Tables</button>

  <h3>Loaded Database State</h3>
  <div id="schemaTables" class="tables-container"></div>

  <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--border-light);">

  <h2><span>🔍</span> 2. Query Pipeline Visualizer</h2>
  <textarea id="queryInput" placeholder="Paste your SELECT query here..."></textarea>
  <button onclick="visualizeQuery()">Visualize Execution Pipeline</button>

  <h3>Execution Pipeline Output</h3>
  <div id="pipelineOutput"></div>

  <script>
    alasql.fn.IF = function(condition, trueVal, falseVal) { return condition ? trueVal : falseVal; };
    alasql.fn.ROUND = function(val, dec) { return val !== null && val !== undefined ? Number(Math.round(val + 'e' + dec) + 'e-' + dec) : null; };

    function getValueByColumnKey(row, colExpr) {
      if (!row) return null;
      let clean = colExpr.trim();
      
      // Look for exact key match first (e.g. m1.machine_id)
      if (row[clean] !== undefined) return row[clean];
      
      // Fallback search by base column name
      if (clean.includes('.')) clean = clean.split('.')[1];
      for (let k in row) {
        if (k.toLowerCase() === clean.toLowerCase() || k.endsWith('.' + clean)) {
          return row[k];
        }
      }
      return null;
    }

    function renderTableHTML(data, title = "") {
      if (!data || data.length === 0) return `<p><em class="null-val">${title ? title + ': ' : ''}Empty result</em></p>`;
      const keys = Object.keys(data[0]);
      let html = `<div>${title ? `<strong style="color: var(--accent-yellow); display: block; margin-bottom: 6px;">${title}</strong>` : ''}<table><thead><tr>`;
      keys.forEach(k => html += `<th>${k}</th>`);
      html += `</tr></thead><tbody>`;
      data.forEach(row => {
        html += `<tr>`;
        keys.forEach(k => {
          const val = row[k];
          html += `<td>${val === null || val === undefined ? '<em class="null-val">NULL</em>' : val}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function loadSchema() {
      const sql = document.getElementById('schemaInput').value;
      alasql('DROP DATABASE IF EXISTS testdb; CREATE DATABASE testdb; USE testdb;');
      
      const statements = sql.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      statements.forEach(stmt => {
        let cleaned = stmt.replace(/If Not Exists/gi, '')
                          .replace(/ENUM\([^)]+\)/gi, 'VARCHAR(50)')
                          .replace(/Truncate table/gi, 'DELETE FROM')
                          .replace(/;$/, '');
        if (cleaned) alasql(cleaned);
      });

      const tablesContainer = document.getElementById('schemaTables');
      tablesContainer.innerHTML = '';
      const tables = alasql('SHOW TABLES');
      tables.forEach(t => {
        const tableName = t.tableid;
        const rows = alasql(`SELECT * FROM ${tableName}`);
        tablesContainer.innerHTML += renderTableHTML(rows, tableName);
      });
    }

    function visualizeQuery() {
      let query = document.getElementById('queryInput').value.trim();
      const output = document.getElementById('pipelineOutput');
      output.innerHTML = '';

      if (!query) return;

      const fromMatch = query.match(/FROM\s+([\s\S]+?)(?=\s+WHERE|\s+GROUP BY|\s+HAVING|\s+ORDER BY|\s+LIMIT|$)/i);
      const groupByMatch = query.match(/GROUP BY\s+([\s\S]+?)(?=\s+HAVING|\s+ORDER BY|\s+LIMIT|\s+SELECT|$)/i);
      const selectMatch = query.match(/SELECT\s+([\s\S]+?)(?=\s+FROM|$)/i);

      let intermediateRows = [];

      // STEP 1: FROM & JOINS
      if (fromMatch) {
        const fromClause = fromMatch[1];
        try {
          intermediateRows = alasql(`SELECT * FROM ${fromClause}`);
          output.innerHTML += `
            <div class="step-box">
              <div class="step-header">Step 1: FROM & JOIN Clause</div>
              <p>Generates joined dataset from: <span class="code-snippet">FROM ${fromClause}</span></p>
              ${renderTableHTML(intermediateRows, "Intermediate Set (" + intermediateRows.length + " rows)")}
            </div>`;
        } catch (err) {
          output.innerHTML += `<div class="step-box" style="color:var(--accent-red)">FROM clause error: ${err.message}</div>`;
          return;
        }
      }

      // STEP 2: GROUP BY
      let groups = {};
      if (groupByMatch && intermediateRows.length > 0) {
        const groupByString = groupByMatch[1].trim();
        const groupCols = groupByString.split(',').map(s => s.trim());
        
        try {
          intermediateRows.forEach(row => {
            const keyVals = groupCols.map(col => getValueByColumnKey(row, col));
            const compositeKey = keyVals.join(' | ');
            if (!groups[compositeKey]) groups[compositeKey] = [];
            groups[compositeKey].push(row);
          });

          let groupHTML = `
            <div class="step-box">
              <div class="step-header">Step 2: GROUP BY Clause</div>
              <p>Buckets intermediate records into groups by: <span class="code-snippet">${groupByString}</span></p>
              <table><thead><tr><th>Group Key (${groupByString})</th><th>Rows in Bucket</th></tr></thead><tbody>`;
          
          Object.keys(groups).forEach(key => {
            groupHTML += `<tr><td><strong style="color: var(--accent-yellow);">${key}</strong></td><td>${renderTableHTML(groups[key])}</td></tr>`;
          });

          groupHTML += `</tbody></table></div>`;
          output.innerHTML += groupHTML;
        } catch (err) {
          output.innerHTML += `<div class="step-box" style="color:var(--accent-red)">GROUP BY visualizer error: ${err.message}</div>`;
        }
      }

      // STEP 3: SELECT & AGGREGATE (Safe evaluation over intermediate sub-view)
      if (selectMatch) {
        try {
          // Flatten intermediate set into temporary memory table to prevent ambiguous column reference crashes
          alasql('DROP TABLE IF EXISTS _temp_view;');
          alasql('CREATE TABLE _temp_view;');
          alasql.tables['_temp_view'].data = intermediateRows;

          // Replace joined table qualifiers (e.g. m1.machine_id) with flat view keys
          let executableQuery = query;
          if (fromMatch) {
            executableQuery = query.replace(new RegExp(`FROM\\s+${fromMatch[1]}`, 'i'), 'FROM _temp_view');
          }

          const finalResult = alasql(executableQuery);
          
          output.innerHTML += `
            <div class="step-box">
              <div class="step-header">Step 3: SELECT & Aggregations (Final Result)</div>
              <p>Applies scalar functions and aggregates per group: <span class="code-snippet">${selectMatch[0]}</span></p>
              ${renderTableHTML(finalResult, "Final Output")}
            </div>`;
        } catch (err) {
          output.innerHTML += `<div class="step-box" style="color:var(--accent-red)">SELECT execution error: ${err.message}</div>`;
        }
      }
    }
  </script>
</body>
</html>
